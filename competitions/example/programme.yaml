# Trofeo di Esempio 2026 - manifestazione fittizia
#
# Il programma di una riunione inventata, con l'elenco iscritti fittizio che
# le sta accanto (`Iscritti_999999.xlsx`). Nessun dato qui viene da una gara
# vera: e' quello che si apre per vedere come lavora l'app, ed e' quello su
# cui girano i test che hanno bisogno di un elenco (tests/test_entry_book.py).
#
# La struttura - categorie, specialita', orari, registro comunicati - e' quella
# di una finale del Trofeo delle Regioni, perche' un esempio che non somiglia a
# una riunione vera non insegna niente e non prova niente.


# ── manifestazione ──────────────────────────────────────────────
name: Trofeo di Esempio 2026
short: example
id: "999999"
location: Velodromo di Esempio
dates: ["2026-09-02"]
track_len: 0.3333

# ── testata, piè di pagina, firma ───────────────────────────────
branding:
  color: "#0a5688"
  signature_mode: image
  signature_scope: always
  name_style: split
  name_width: 0.62

# ── categorie ───────────────────────────────────────────────────
categories:
  ES: {name: ESORDIENTI MASCHI, sex: M, order: 1}
  ED: {name: ESORDIENTI FEMMINE, sex: F, order: 2}
  AL: {name: ALLIEVI MASCHI, sex: M, order: 3}
  DA: {name: ALLIEVE FEMMINE, sex: F, order: 4}
  JU: {name: JUNIORES MASCHI, sex: M, order: 5}
  DJ: {name: JUNIORES FEMMINE, sex: F, order: 6}

# ── specialità ──────────────────────────────────────────────────
events:
  omnium:
    name: OMNIUM
    short: Omnium
    order: 0
  madison:
    name: MADISON
    short: Madison
    order: 1
  ins_squadre:
    name: INSEGUIMENTO A SQUADRE
    short: Ins. Squadre
    order: 2
  vel_squadre:
    name: VELOCITÀ A SQUADRE
    short: Vel. Squadre
    order: 3
  eliminazione:
    name: ELIMINAZIONE
    short: Eliminazione
    order: 4
  chilometro:
    name: CHILOMETRO DA FERMO
    short: Chilometro
    order: 5

# ── quote di iscrizione (comunicato STP) ────────────────────────
quotas:
  max_events_level: warn
  max_events_count_reserves: false

# ── programma gare ──────────────────────────────────────────────
programme:

  # ── giorno 1 · 2026-09-02 ────────────────────────────
  - cat: ES
    event: omnium
    day: 1
    rounds:
      - {key: Tempo Race, seq: 2, distance: 2.7, laps: 8, sprints: 4, start: "9:15", docs: []}
      - {key: Eliminazione, seq: 8, start: "11:20", docs: []}
      - {key: Corsa a Punti, seq: 13, distance: 6.7, laps: 20, sprints: 4, start: "12:45", docs: []}
  - cat: ES
    event: madison
    day: 1
    rounds:
      - {key: Composizione coppie, kind: setup}
