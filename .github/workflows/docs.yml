name: docs

# Read the Docs builds and hosts the site (blueband.readthedocs.io) from its
# own webhook; this job only checks that the docs still build, in both
# languages, before a change lands. `-W` so a broken reference or a title
# underline that is one character short fails the branch instead of the site.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r docs/requirements.txt
      - name: English
        run: python -m sphinx -b html -D language=en -W docs docs/_build/html
      - name: Italian
        run: python -m sphinx -b html -D language=it -W docs docs/_build/html-it
