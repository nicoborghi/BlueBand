name: tests

# The suite on every push and every pull request, with coverage sent to
# Codecov. The Windows build (`build.yml`) runs its own quick `pytest -q`
# before it freezes anything; this is the one that gates the branch.
#
# Roughly a third of the suite is skipped here on purpose: the tests that read
# the federation's entry workbook need a file that lives on the commissaire's
# Drive folder and carries riders' personal data, so it is not in the repo and
# `tests/conftest.py` skips them wherever it is missing. Coverage from CI is
# therefore a floor, not the whole picture - read a drop, not the absolute
# number.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the floor the project declares and the version the installer freezes
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q --cov --cov-report=xml --cov-report=term-missing

      - name: Codecov
        # One upload is enough; the second interpreter runs the same lines.
        #
        # And only when there is a token to do it with: Codecov stopped taking
        # tokenless uploads on a repository's default branch ("Token required
        # because branch is protected"), so without the secret this step cannot
        # succeed and would fail the branch over a report nobody can send. With
        # the secret set it runs, and a genuine upload error is still loud.
        if: matrix.python-version == '3.12' && env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
