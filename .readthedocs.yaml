# Read the Docs configuration — https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# The project is built once per language: the English build is the source, the
# Italian one is the same source with `locales/it/` applied. Read the Docs
# exports READTHEDOCS_LANGUAGE, which `docs/conf.py` reads.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  builder: dirhtml
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
