[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blueband"
version = "0.3.0"
description = "Commissaire console for track cycling competitions"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Nicola Borghi" }]

# Pinned, not ranged. This list is also the installer's manifest: the Windows
# build freezes exactly what is here, and a version that drifts between the
# laptop it was tested on and the one it was built on is a version nobody
# tested.
#
# pandas is declared even though Streamlit already requires it: the app imports
# it directly (the grids and the tables are frames), and a dependency that is
# used should be named by whoever uses it rather than inherited.
dependencies = [
    "streamlit==1.45.1",
    "pandas==2.2.3",
    "jinja2==3.1.6",
    "PyYAML==6.0.2",
    # the entry lists. openpyxl reads and writes the modern master workbook
    # directly; xlrd is what pandas reaches for behind `read_excel` on the
    # legacy `.xls` the federal system still exports.
    "openpyxl==3.1.5",
    "xlrd==2.0.1",
]

[project.optional-dependencies]
# ruff is pinned like the runtime deps: its default rule set grows with the
# version, and an unpinned linter turns a release into a red branch on code
# nobody touched.
dev = ["pytest>=8", "pytest-cov", "ruff==0.16.4"]
build = ["pyinstaller==6.11.1"]
# the documentation (docs/conf.py), built by Read the Docs in two languages
# from one English source. No gallery and no notebook execution: the pages are
# prose and tables, and a plugin that runs code is a plugin that breaks the
# docs build for reasons unrelated to the docs.
docs = [
    "sphinx>=7.2",
    "sphinx-book-theme>=1.1",
    "sphinx-copybutton>=0.5",
    "myst-parser>=2.0",
    "sphinx-intl>=2.2",
]

[project.urls]
Homepage = "https://github.com/nicoborghi/BlueBand"
Documentation = "https://blueband.readthedocs.io/"

[tool.setuptools]
packages = ["core", "core.formats", "core.i18n", "render", "ui", "ui.pages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Spelled out rather than inherited: correctness (pyflakes) and the parts of
# pycodestyle that are not a matter of taste. Style rules - import order,
# comprehension idioms - are deliberately out: the hanging-indent imports and
# the explicit loops here are how the code is written.
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
# the app, not the tests and not the packaging scripts: what is measured is
# what a jury runs.
#
# Module names, not file names. `source` entries that are not directories are
# resolved with `importlib.util.find_spec`, and "app.py" resolves as the
# submodule `py` of the package `app` - which *imports* app.py to look inside
# it, from within coverage's own trace callback. The import of pandas that
# happens down there is aborted half way and numpy stays broken for the rest
# of the process ("cannot load module more than once per process"), so every
# later `import pandas` in the run raises. Two names with an extension cost
# the whole suite.
source = ["core", "render", "ui", "app", "launcher"]
branch = true
omit = ["*/__pycache__/*", "tests/*"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == \"__main__\":",
]
